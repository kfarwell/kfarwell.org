name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  MIX_ENV: prod

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get --only prod

      - run: mix compile --warnings-as-errors

      - run: mix format --check-formatted

      - run: mix assets.setup

      - run: mix assets.deploy

      - run: mix release --overwrite

      - run: tar czf kfarwell.tar.gz -C _build/prod/rel kfarwell

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: kfarwell.tar.gz
