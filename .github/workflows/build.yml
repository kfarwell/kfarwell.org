name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          usesh: true
          prepare: pkg install -y elixir erlang git-tiny
          run: |
            set -e
            export MIX_ENV=prod LANG=C.UTF-8
            mix local.hex --force
            mix local.rebar --force
            mix deps.get --only prod
            mix compile --warnings-as-errors
            mix format --check-formatted
            mix assets.setup
            mix assets.deploy
            mix release --overwrite
            tar czf kfarwell-freebsd-amd64.tar.gz -C _build/prod/rel kfarwell

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: kfarwell-freebsd-amd64.tar.gz
          if-no-files-found: error
